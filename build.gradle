plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tough_environment" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration() {modId = "tough_environment"}
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.ladysnake.org/releases" }
}

loom {
    accessWidenerPath = file("src/main/resources/tough_environment.accesswidener")
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // BTWR: Shared Library
    modImplementation ("maven.modrinth:btwr-shared-library:${project.btwr_sl_version}")
    //modImplementation files("libs/btwr-shared-library-${project.btwr_sl_version}.jar")

    // Mod Menu
    modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"

    // Cloth Config API
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Better With Time
    //modCompileOnly "maven.modrinth:better-with-time:${project.bwt_version}"

    // Sturdy Trees (for testing chisels)
    //modLocalRuntime "maven.modrinth:sturdy-trees:${project.sturdy_trees_version}"

    // Self Sustainable
    //modCompileOnly "maven.modrinth:self-sustainable:${project.self_sustainable_version}"
    //modLocalRuntime "maven.modrinth:self-sustainable:${project.self_sustainable_version}"

    // EMI
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "btwr_sl_version", project.btwr_sl_version

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "btwr_sl_version": project.btwr_sl_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.register('checkCommentInClass') {
    def classFilePath = "src/main/java/org/btwr/tough_environment/ToughEnvironmentMod.java"
    def requiredComment = "// Do not remove this comment or the project will NOT compile!"

    doLast {
        def classFile = file(classFilePath)
        if (!classFile.exists()) {
            throw new GradleException("Class file not found: $classFilePath")
        }

        def fileContent = classFile.text
        if (!fileContent.contains(requiredComment)) {
            throw new GradleException("Required comment '$requiredComment' not found in $classFilePath")
        }
        //else { println "Required comment found in $classFilePath" }
    }
}

compileJava.dependsOn checkCommentInClass


java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "projectName", project.name

    from("LICENSE") {
        rename { "${it}_${project.name}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
